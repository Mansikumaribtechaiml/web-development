<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Cards</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }

        .cards{
            display: inline;
        }

        .card{
            margin: 10px;
            height: 150px;
            width: 47%;
            box-shadow: 1px;
            border: 1px solid rgb(255, 40, 108);
            display: inline-block;
        }

        .info,img{
            height: 150px;
            width: 150px;
            display: inline-block;
        }
        
        .info{
            margin: 0%;
            width: auto;
            align-items: center;
            line-height: 35px;
            vertical-align: top;
            padding: 20px 10px 20px 10px;
        }
        

        button{
            border-radius: 5px;
            color: white;
            background-color: rgb(243, 50, 108);
            height: 30px;
            width: 80px;
        }

    </style>
</head>
<body>
    <div class="cards">
        <div class="card">
            <img src="https://cinemasentries.com/wp-content/uploads/2022/02/e_t_the_extra_terrestrial_ver2.jpg" alt="">
            <div class="info">
                <h3>ET (2022)</h3>
                <h4>Releasing on 11 Mar, 2022</h4>
                <button>Book ticket</button>
            </div>
        </div>
        <div class="card">
            <img src="https://assets.gadgets360cdn.com/pricee/assets/product/202202/Jhund_Poster_1645612723.jpg" alt="">
            <div class="info">
                <h3>Jhund</h3>
                <h4>Releasing on 11 Mar, 2022</h4>
                <button>Book ticket</button>
            </div>
        </div>
    </div>
    <div  class="cards">
        <div class="card">
            <img src="https://tse1.mm.bing.net/th/id/OIP.vZyjOsBRdRriLkGI-znH1QHaFS?r=0&pid=Api&h=220&P=0" alt="">
            <div class="info">
                <h3>Gangubai Kathiawadi</h3>
                <h4>Releasing on 11 Mar, 2022</h4>
                <button>Book ticket</button>
            </div>
        </div>
        <div class="card">
            <img src="https://wallpapers.com/images/hd/radhe-shyam-movie-poster-wlf5iko7w3xpktlo.jpg" alt="">
            <div class="info">
                <h3>Radhe Shyam</h3>
                <h4>Releasing on 11 Mar, 2022</h4>
                <button>Book ticket</button>
            </div>
        </div>
    </div>
    <div class="cards">
        <div class="card">
            <img src="https://cdnb.artstation.com/p/assets/images/images/038/800/657/large/nova-uncharted-poster.jpg?1624098313" alt="">
            <div class="info">
                <h3>Uncharted</h3>
                <h4>Releasing on 11 Mar, 2022</h4>
                <button>Book ticket</button>
            </div>
        </div>
        <div class="card">
            <img src="https://tse4.mm.bing.net/th/id/OIP.yYW16aTZnCoLymK_gMmS-QHaJQ?r=0&pid=Api&h=220&P=0" alt="">
            <div class="info">
                <h3>The Batman</h3>
                <h4>Releasing on 11 Mar, 2022</h4>
                <button>Book ticket</button>
            </div>
        </div>
    </div>
</body>
</html>
