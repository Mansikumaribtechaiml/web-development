<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 100px 300px;
            grid-template-areas: "nav nav nav nav"
                                 "box1 box2 box3 box4";
            gap: 10px;
            height: 100vh;
        }

        body #nav{
            grid-area: nav;
        }
        body .box:nth-child(2){
            grid-area: box1;
            background-color: rgb(249, 19, 19);
        }
        body .box:nth-child(3){
            grid-area: box2;
            background-color: rgb(32, 249, 83);
        }
        body .box:nth-child(4){
            grid-area: box3;
            background-color: rgb(39, 77, 247);
        }
        body .box:nth-child(5){
            grid-area: box4;
            background-color: rgb(83, 83, 83);
        }

        #nav{
            height: 100px;
            background-color: rgb(251, 231, 12);
            color: rgb(0, 0, 0);
            line-height: 100px;
            padding: 10px;
        }

        .box{
            height: 300px;
            color: rgb(0, 0, 0);
            padding: 10px;
        }

        @media (max-width: 1000px){
            body{
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: 100px 300px 300px;
                grid-template-areas: "nav nav"
                                     "box1 box2"
                                     "box3 box4";
                gap: 10px;
            }
        }

        @media (max-width: 600px){
            body{
                grid-template-columns: 1fr;
                grid-template-rows: 100px 300px 300px;
                grid-template-areas: "nav"
                                     "box1"
                                     "box2"
                                     "box3"
                                     "box4";

                gap: 10px;
            }
        }
        </style>

</head>
<body>
    <div id="nav">nav</div>
    <div class="box">box 1</div>
    <div class="box">box 2</div>
    <div class="box">box 3</div>
    <div class="box">box 4</div>
</body>
</html>
