<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 100px 300px;
            grid-template-areas: "nav nav"
                                 "box1 box2";
            gap: 10px;
            height: 100vh;
        }

        #container #nav{
            grid-area: nav;
        }
        #container .box:nth-child(2){
            grid-area: box1;
            background-color: rgb(254, 104, 104);
        }
        #container .box:nth-child(3){
            grid-area: box2;
            background-color: rgb(73, 255, 115);
        }

        #nav{
            height: 100px;
            background-color: rgb(251, 231, 12);
            color: white;
            line-height: 100px;
        }

        .box{
            height: 300px;
            color: white;
            display: flex;
            align-items: center;
        }

        @media (max-width: 600px){
            #container{
                grid-template-columns: 1fr;
                grid-template-rows: 100px 300px 300px;
                grid-template-areas: "nav"
                                     "box1"
                                     "box2";
            }
        }
    </style>
</head>
<body>
    <div id="container">
    <div id="nav">
        <p>Navigation</p>
    </div>
    <div class="box">
        <p>Box 1</p>
    </div>
    <div class="box">
        <p>Box 2</p>
    </div>
    </div>
</body>
</html>
